name: waptia_store
description: "Waptia — Infortts App Store. Download and update Infortts apps."
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1
  infortts_shared:
    path: ../../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

