<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Waptia Admin Console — Infortts Fleet App Management">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Waptia Admin">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Waptia Admin | Infortts Fleet Console</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #030712; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #infortts-loader-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 40%, #0d1527 0%, #030712 85%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999999; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }
    #infortts-loader-container.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    .emblem-wrapper { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .hexagon-core { width: 48px; height: 48px; background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(13, 21, 39, 0.9)); border: 1.5px solid #00e5ff; border-radius: 10px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; }
    .hexagon-inner { transform: rotate(-45deg); color: #00e5ff; font-weight: 900; font-size: 20px; }
    .brand-title { font-size: 16px; font-weight: 800; letter-spacing: 4px; color: #f3f4f6; margin-bottom: 6px; }
    .brand-subtitle { font-size: 9px; letter-spacing: 2px; color: #00e5ff; margin-bottom: 20px; }
    .progress-bar { width: 140px; height: 2px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { width: 100%; height: 100%; background: #00e5ff; animation: progress 1.5s infinite ease-in-out; }
    @keyframes progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  </style>

  <script>
    let loaderRemoved = false;
    function removeInforttsLoader() {
      if (loaderRemoved) return;
      loaderRemoved = true;
      const loader = document.getElementById("infortts-loader-container");
      if (loader) {
        loader.classList.add("fade-out");
        setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
      }
    }
    window.inforttsAppReady = function() { removeInforttsLoader(); };
    window.addEventListener('flutter-first-frame', removeInforttsLoader);
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="infortts-loader-container">
    <div class="emblem-wrapper">
      <div class="hexagon-core">
        <div class="hexagon-inner">⚡</div>
      </div>
    </div>
    <div class="brand-title">WAPTIA ADMIN</div>
    <div class="brand-subtitle">INFORTTS FLEET CONTROL</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: null },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp().then(function() {
              setTimeout(removeInforttsLoader, 2000);
            });
            setTimeout(removeInforttsLoader, 20000);
          });
        }
      });
    });
  </script>
</body>
</html>
